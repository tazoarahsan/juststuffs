:root{

  --bg:#f6f8fc;--surface:#ffffff;--text:#202124;--text-2:#5f6368;--text-3:#80868b;

}

  color-scheme:dark;
  --bg:#1b1d20;--surface:#24272b;--text:#e8eaed;--text-2:#b0b5ba;--text-3:#8a9096;
  --line:#33373c;--line-strong:#454a50;--hover:#2e3236;--selected:#1f4f5e;--nav-active:#21414f;--nav-active-text:#d7ecff;
  --search:#2a2e33;--teal-soft:#1d3a3b;--teal-deep:#8fd3d1;

}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1b1d20;--surface:#24272b;--text:#e8eaed;--text-2:#b0b5ba;--text-3:#8a9096;
  --line:#33373c;--line-strong:#454a50;--hover:#2e3236;--selected:#1f4f5e;--nav-active:#21414f;--nav-active-text:#d7ecff;
  --search:#2a2e33;--teal-soft:#1d3a3b;--teal-deep:#8fd3d1;
  --note-bg:#3a3220;--note-line:#5a4c26;--note-text:#f1d894;--canvas:#2a2e31;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sys);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,.row:focus-visible,li:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}

.topbar{height:64px;flex:none;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--teal);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.brand .name{font-size:20px;color:var(--text-2);white-space:nowrap}
.brand .name b{color:var(--text);font-weight:500}
.search{flex:1;max-width:720px;display:flex;align-items:center;gap:8px;background:var(--search);border-radius:8px;padding:0 14px;height:46px;color:var(--text-2)}
.search svg{width:20px;height:20px;fill:currentColor;flex:none}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:15px;color:var(--text);height:100%;min-width:0}
.spacer{flex:1}
.me{width:34px;height:34px;border-radius:50%;background:#CD4F50;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}

.body{flex:1;display:flex;min-height:0}
.nav{width:256px;flex:none;padding:8px 8px 8px 0;overflow-y:auto}
.nav-head{font-size:12px;color:var(--text-3);padding:16px 12px 6px 26px;font-weight:500}
.navlist{list-style:none;margin:0;padding:0}
.navlist li{display:flex;align-items:center;gap:16px;height:34px;padding:0 12px 0 26px;border-radius:0 17px 17px 0;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.navlist li:hover{background:var(--hover)}
.navlist li.active{background:var(--nav-active);color:var(--nav-active-text)}
.navlist li .dot{width:14px;height:14px;border-radius:4px;flex:none}
.navlist li svg{width:20px;height:20px;fill:currentColor;flex:none}
.navlist li .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.navlist li .count{font-size:12px;color:var(--text-2)}
.navlist li .count.wait{font-size:11px;color:var(--text-3);font-weight:400}
.navlist li.active .count{color:inherit}

.list-col{width:440px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;margin-right:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.list-tools{height:48px;flex:none;display:flex;align-items:center;gap:6px;padding:0 14px 0 16px;border-bottom:1px solid var(--line)}
.list-tools .title{font-size:14px;font-weight:500}
.list-tools .grow{flex:1}
.list-tools .meta{font-size:12px;color:var(--text-3)}
.list{overflow-y:auto;flex:1}
.track-note{margin:12px 14px 4px;padding:10px 12px;border-radius:10px;background:var(--note-bg);border:1px solid var(--note-line);color:var(--note-text);font-size:12px;line-height:17px}
.row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.row:hover{background:var(--hover)}
.row.selected{background:var(--selected)}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex:none;background:var(--teal)}
.row .content{min-width:0}
.row .sender{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .line2{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .line2 .subj{color:var(--text);font-weight:500}
.row .right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.row .date{font-size:12px;color:var(--text-2);white-space:nowrap}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;white-space:nowrap;line-height:1.4;background:var(--teal-soft);color:var(--teal-deep)}
.row .rowcopy{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:none;align-items:center;gap:5px;background:var(--surface);color:var(--teal);border:1px solid var(--line-strong);font-weight:700;font-size:11px;padding:6px 10px;border-radius:7px;box-shadow:0 1px 3px rgba(0,0,0,.12);line-height:1;z-index:2}
.row:hover .rowcopy,.row.selected .rowcopy,.row:focus-within .rowcopy{display:inline-flex}
.row .rowcopy.copied{color:#188038}
.pending-row{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--text-3)}
.pending-row .avatar{background:var(--line-strong);color:var(--text-2)}
.pending-row .subj{font-size:13px;color:var(--text-2)}
.pending-row .sub{font-size:12px;margin-top:2px}
.empty-list{padding:40px 24px;text-align:center;color:var(--text-3);font-size:13px;line-height:19px}

.read-col{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.read-tools{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line)}
.read-tools .back{display:none;width:38px;height:38px;border:0;background:transparent;border-radius:50%;align-items:center;justify-content:center}
.read-tools .back svg{width:22px;height:22px;fill:currentColor}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:12px;font-weight:500;color:var(--text-2)}
.seg button.on{background:var(--teal-soft);color:var(--teal-deep)}
.read-scroll{overflow-y:auto;flex:1;padding:0 0 60px}
.read-inner{max-width:900px;margin:0 auto;padding:16px 28px 0}
.read-empty{padding:80px 24px;text-align:center;color:var(--text-3)}

.internal{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--note-bg);border:1px solid var(--note-line);color:var(--note-text);border-radius:10px;padding:8px 12px;font-size:12px;margin:14px 0 18px}

.subject-head{display:flex;align-items:flex-start;gap:12px;margin:0 0 18px}

.from-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}

.from-meta{flex:1;min-width:0}

.from-right{color:var(--text-2);font-size:12px;white-space:nowrap}
.preheader{font-size:13px;color:var(--text-2);margin:0 0 18px 52px}

.mail-canvas{background:var(--canvas);border-radius:12px;padding:0;overflow:hidden;transition:max-width .2s ease;margin:0 auto}
.mail-canvas.mobile{max-width:400px}
.mail-canvas iframe{display:block;width:100%;border:0;height:600px;background:#eef1f1}

@media (max-width:1100px){.nav{width:210px}.list-col{width:360px}}

.mobile-tracks{display:none;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);flex:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

mer’s first active year. With AI agents now included in every REsimpli plan, there’s a lot to share.<\/p><\/td><\/tr><tr><td class=\"px\" bgcolor=\"#ffffff\" style=\"background:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:25px;color:#3c4a4a;padding:16px 40px 6px 40px;\"><p style=\"margin:0 0 16px 0;\">I’d be happy to <a href=\"REPLACE_LINK::strategy_call\" style=\"color:#008088;text-decoration:underline;font-weight:600;\">spend 15 minutes helping you identify a simple next step<\/a>.<\/p><p style=\"margin:0;\">Whether you’re ready to jump back in or taking a break, I appreciate the referrals you’ve sent our way and the partnership we’ve had.<\/p><\/td><\/tr><tr><td class=\"px\" bgcolor=\"#ffffff\" style=\"background:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:25px;color:#3c4a4a;padding:14px 40px 30px 40px;\"><p style=\"margin:0;\"><strong style=\"color:#13231f;\">Chenay<\/strong><br>Director of Partnerships<br>REsimpli<\/p><\/td><\/tr>\n<tr><td align=\"center\" class=\"px\" style=\"padding:22px 40px 34px 40px;background:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;text-align:center;\"><p style=\"margin:0;font-size:12px;line-height:18px;color:#9aa7a7;text-align:center;mso-line-height-rule:exactly;\"><a href=\"{{email.unsubscribe_link}}\" style=\"color:#9aa7a7;text-decoration:underline;mso-style-textfill-fill-color:#9aa7a7;\"><!--[if mso]><font color=\"#9aa7a7\"><![endif]-->Unsubscribe<!--[if mso]><\/font><![endif]--><\/a>&nbsp;&middot;&nbsp;{{location.full_address}}<\/p><!--[if mso]><p style=\"margin:0;line-height:8px;mso-line-height-rule:exactly;font-size:8px;background:#ffffff;\">&nbsp;<\/p><![endif]--><\/td><\/tr>\n<\/table>\n<\/td><\/tr><\/table>\n<\/body>\n<\/html>", "order": 2}], "tracks": [{"key": "u6", "label": "Under 6 months", "color": "#008088", "ready": true, "note": "Friendly onboarding and first-referral support. No cancellation messaging. Suppress anyone who has already referred, opted out, or had their account closed."}, {"key": "m618", "label": "6–18 months", "color": "#3f7fb0", "ready": true, "note": "Supportive activation. The December 31 requirement appears only in Touch 3. Suppress anyone who has already referred, opted out, or had their account closed."}, {"key": "o18", "label": "Over 18 months", "color": "#8e6cc0", "ready": true, "note": "Respectful requalification with the December 31 deadline in every touch. No meeting invite for this segment. Suppress anyone who has already referred, opted out, or had their account closed."}, {"key": "dorm", "label": "Dormant affiliates", "color": "#c07a1a", "ready": true, "note": "Previously active affiliates with no referrals May–October 2026 (about 300). Send Touch 2 seven days after Touch 1, then Touch 3 10–14 days later, before December 31. Remove anyone who referred after October 2026 or opted out."}]};
const EMAILS = DATA.emails, TRACKS = DATA.tracks;
const TR = Object.fromEntries(TRACKS.map(t=>[t.key,t]));
const state = {filter:"all", search:"", selected:null, mobile:false};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const COPY_ICON = '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>';

function buildNav(){
  $("#tracklist").innerHTML = TRACKS.map(t=>`<li data-filter="${t.key}" tabindex="0"><span class="dot" style="background:${t.color}"></span><span class="lbl">${esc(t.label)}</span>${t.ready?`<span class="count">${EMAILS.filter(e=>e.track===t.key).length}</span>`:`<span class="count wait">pending</span>`}</li>`).join("");
  $("#cnt-all").textContent = EMAILS.length;
  $("#mobileTracks").innerHTML = [{key:"all",label:"All"}].concat(TRACKS).map(t=>`<button data-filter="${t.key}" class="${t.key===state.filter?'on':''}">${esc(t.label)}</button>`).join("");
}
function setFilter(f){
  state.filter = f;
  document.querySelectorAll(".navlist li").forEach(li=>li.classList.toggle("active", li.dataset.filter===f));
  document.querySelectorAll("#mobileTracks button").forEach(b=>b.classList.toggle("on", b.dataset.filter===f));
  renderList();
}
function visible(){
  let arr = EMAILS.filter(e => state.filter==="all" || e.track===state.filter);
  if(state.search){ const q=state.search.toLowerCase(); arr = arr.filter(e=>(e.subject+" "+e.preview+" "+TR[e.track].label+" "+e.touch).toLowerCase().includes(q)); }
  return arr.sort((a,b)=>TRACKS.indexOf(TR[a.track])-TRACKS.indexOf(TR[b.track]) || a.order-b.order);
}
function renderList(){
  const list = $("#list"); const arr = visible();
  const t = TR[state.filter];
  $("#listTitle").textContent = t ? t.label : "All sequences";
  let html = "";
  if(t && t.note) html += `<div class="track-note">${esc(t.note)}</div>`;
  arr.forEach(e=>{
    html += `<div class="row${state.selected===e.id?' selected':''}" data-id="${e.id}" tabindex="0">
      <div class="avatar">C</div>
      <div class="content"><div class="sender">Chenay</div><div class="line2"><span class="subj">${esc(e.subject)}</span> — ${esc(e.preview)}</div></div>
      <div class="right"><span class="chip">${esc(TR[e.track].label)} · ${esc(e.touch.split(" of")[0])}</span><span class="date">${esc(e.date)}</span></div>
      <button class="rowcopy" data-copy="${e.id}" title="Copy this email's HTML">${COPY_ICON}HTML</button></div>`;
  });
  const pendingTracks = (state.filter==="all" ? TRACKS : [t]).filter(x=>x && !x.ready);
  if(!state.search) pendingTracks.forEach(p=>{
    p.pending.forEach((s,i)=>{ html += `<div class="pending-row"><div class="avatar">C</div><div><div class="subj">${esc(s)}</div><div class="sub">${esc(p.label)} · Touch ${i+1} · built after the Under 6 months emails are approved</div></div></div>`; });
  });
  if(!html) html = '<div class="empty-list">No emails match that search. Try a subject line or a sequence name.</div>';
  list.innerHTML = html;
  $("#listMeta").textContent = arr.length + (arr.length===1?" email ready":" emails ready");
}
function sizeFrame(f){
  try{ const d=f.contentDocument; if(!d||!d.body) return; f.style.height = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight) + "px"; }catch(err){}
}
function openEmail(id){
  const e = EMAILS.find(x=>x.id===id); if(!e) return;
  state.selected = id;
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("selected", r.dataset.id===id));
  const t = TR[e.track];
  $("#readInner").innerHTML = `
    <div class="internal"><b>Internal</b><span class="sep">·</span>${esc(t.label)}<span class="sep">·</span>${esc(e.touch)}<span class="sep">·</span>${esc(e.full)}</div>
    <div class="subject-head"><h1>${esc(e.subject)}</h1><span class="chip">${esc(t.label)}</span>
      <button class="copyhtml-btn" data-copy="${e.id}">${COPY_ICON}Copy HTML</button></div>
    <div class="from-row"><div class="avatar">C</div><div class="from-meta"><div class="fn"><b>Chenay</b> <span style="color:var(--text-2)">· Director of Partnerships</span></div><div class="to">to affiliates (${esc(t.label)})</div></div><div class="from-right">${esc(e.full)}</div></div>
    <p class="preheader"><b>Preview text:</b> ${esc(e.preview)}</p>
    <div class="mail-canvas${state.mobile?' mobile':''}" id="canvas"><iframe id="frame" title="Email preview" sandbox="allow-same-origin"></iframe></div>`;
  const f = $("#frame");
  f.addEventListener("load", ()=>{ sizeFrame(f); setTimeout(()=>sizeFrame(f),400); });
  f.srcdoc = e.html;
  $("#readScroll").scrollTop = 0;
  $("#app").classList.add("reading");
}
function setWidth(m){
  state.mobile = m;
  $("#wDesk").classList.toggle("on",!m); $("#wMob").classList.toggle("on",m);
  const c = $("#canvas"); if(c){ c.classList.toggle("mobile",m); const f=$("#frame"); setTimeout(()=>sizeFrame(f),250); }
}
function copyText(text){
  return new Promise((resolve,reject)=>{
    const fallback=()=>{ const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.cssText="position:fixed;top:0;left:0;width:2px;height:2px;opacity:0";
      document.body.appendChild(ta); ta.focus(); ta.select(); let ok=false; try{ok=document.execCommand("copy");}catch(err){} document.body.removeChild(ta); ok?resolve():reject(); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(resolve,fallback); else fallback();
  });
}
function showCopyModal(text){
  let m = document.getElementById("copyModal");
  if(!m){
    m = document.createElement("div"); m.id="copyModal";
    m.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px";
    m.innerHTML='<div style="background:var(--surface);color:var(--text);border-radius:12px;max-width:760px;width:100%;padding:18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-weight:500">Clipboard access is blocked here. Press Ctrl+C (Cmd+C on Mac) to copy the selected code.<button id="copyModalClose" style="border:0;background:var(--hover);border-radius:6px;padding:6px 12px">Close</button></div><textarea id="copyModalTa" spellcheck="false" style="width:100%;height:320px;border:1px solid var(--line-strong);border-radius:8px;font:12px/1.5 monospace;padding:10px;background:var(--bg);color:var(--text)"></textarea></div>';
    document.body.appendChild(m);
    m.querySelector("#copyModalClose").onclick=()=>m.style.display="none";
    m.addEventListener("click",ev=>{ if(ev.target===m) m.style.display="none"; });
  }
  m.style.display="flex"; const ta=m.querySelector("#copyModalTa"); ta.value=text; ta.focus(); ta.select();
}
function copyEmail(id, btn){
  const e = EMAILS.find(x=>x.id===id); if(!e) return;
  const pending = [...new Set(e.html.match(/REPLACE_LINK::[a-z0-9_]+|\{\{affiliate_link\}\}/g)||[])];
  if(pending.length && !confirm("This email still has placeholder link(s):\n\n  "+pending.join("\n  ")+"\n\nSwap in the real link(s) in GHL after pasting. Copy anyway?")) return;
  copyText(e.html).then(()=>{
    const orig = btn.innerHTML; btn.classList.add("copied"); btn.innerHTML = btn.classList.contains("rowcopy") ? "&#10003; Copied" : "&#10003; Copied!";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.innerHTML = orig; }, 1600);
  }).catch(()=>showCopyModal(e.html));
}
document.addEventListener("click", ev=>{
  const c = ev.target.closest("[data-copy]"); if(c){ ev.stopPropagation(); copyEmail(c.dataset.copy, c); return; }
  const r = ev.target.closest(".row"); if(r){ openEmail(r.dataset.id); return; }
  const f = ev.target.closest("[data-filter]"); if(f){ setFilter(f.dataset.filter); }
});
document.addEventListener("keydown", ev=>{
  if(ev.key==="Enter"){ const r=ev.target.closest&&ev.target.closest(".row,[data-filter]"); if(r && !ev.target.matches("button")){ r.click(); return; } }
  if(ev.target.tagName==="INPUT" || (ev.key!=="ArrowDown" && ev.key!=="ArrowUp")) return;
  ev.preventDefault(); const arr=visible(); let i=arr.findIndex(e=>e.id===state.selected);
  i = ev.key==="ArrowDown" ? Math.min(arr.length-1,i+1) : Math.max(0,i-1); if(arr[i]) openEmail(arr[i].id);
});
$("#search").addEventListener("input", e=>{ state.search=e.target.value.trim(); renderList(); });
$("#wDesk").onclick=()=>setWidth(false); $("#wMob").onclick=()=>setWidth(true);
$("#backBtn").onclick=()=>$("#app").classList.remove("reading");
window.addEventListener("resize", ()=>{ const f=$("#frame"); if(f) sizeFrame(f); });
buildNav(); renderList();
if(EMAILS.length){ openEmail(EMAILS[0].id); if(window.innerWidth<=820) $("#app").classList.remove("reading"); }
</script>
</body>
</html>
